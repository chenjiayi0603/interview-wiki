<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试知识库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --sidebar-bg: #1a1a2e;
      --sidebar-hover: #16213e;
      --sidebar-active: #0f3460;
      --accent: #e94560;
      --accent2: #533483;
      --text-light: #e0e0e0;
      --text-dim: #8892b0;
      --main-bg: #f8f9fc;
      --card-bg: #ffffff;
      --border: #e8e8ec;
      --heading: #1a1a2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: flex; height: 100vh; background: var(--main-bg);
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 340px; min-width: 340px;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-header h1 {
      font-size: 18px; font-weight: 700;
      color: #fff; letter-spacing: 0.5px;
    }
    .sidebar-header h1 span { color: var(--accent); }
    .sidebar-header p {
      font-size: 12px; color: var(--text-dim);
      margin-top: 4px;
    }
    .sidebar-header .sub-info {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; display: flex; gap: 8px;
    }
    .sidebar-header .sub-info .cat-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; vertical-align: middle; margin-right: 3px;
    }
    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-search input {
      width: 100%; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 13px;
      background: rgba(255,255,255,0.06);
      color: #fff; outline: none;
      transition: all 0.2s;
    }
    .sidebar-search input::placeholder { color: var(--text-dim); }
    .sidebar-search input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.1);
    }
    .category-tabs {
      display: flex; padding: 8px 16px; gap: 5px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
    }
    .cat-btn {
      padding: 3px 11px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; background: transparent;
      color: var(--text-dim); font-size: 11.5px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--text-light); }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cat-btn .count {
      display: inline-block; margin-left: 3px;
      font-size: 10px; opacity: 0.7;
    }
    .cat-btn.active .count { opacity: 0.9; }
    .sidebar-stats {
      display: flex; justify-content: space-between;
      padding: 8px 16px;
      font-size: 12px; color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .file-list {
      flex: 1; overflow-y: auto;
      padding: 4px 0 12px;
    }
    .file-list::-webkit-scrollbar { width: 4px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .file-item {
      padding: 10px 16px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .file-item:hover { background: rgba(255,255,255,0.05); }
    .file-item.active {
      background: rgba(233,69,96,0.1);
      border-left-color: var(--accent);
    }
    .file-item .title {
      font-size: 13px; color: var(--text-light);
      line-height: 1.4;
    }
    .file-item.active .title { color: #fff; font-weight: 500; }
    .file-item .path {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .file-item.empty {
      color: var(--text-dim); font-size: 13px;
      padding: 24px 16px; text-align: center;
    }

    /* 子类分组头 */
    .subcat-header {
      padding: 8px 16px; cursor: pointer;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 6px;
      user-select: none;
    }
    .subcat-header:hover { background: rgba(255,255,255,0.07); }
    .subcat-arrow {
      font-size: 10px; color: var(--text-dim);
      width: 14px; text-align: center;
      transition: transform 0.15s;
    }
    .subcat-name {
      font-size: 12px; color: var(--text-light);
      font-weight: 600; flex: 1;
    }
    .subcat-count {
      font-size: 11px; color: var(--text-dim);
      background: rgba(255,255,255,0.08);
      padding: 1px 8px; border-radius: 10px;
    }
    .subcat-items .file-item { padding-left: 28px; }
    .subcat-items .file-item .path { padding-left: 0; }

    /* ===== 主内容区 ===== */
    .main {
      flex: 1; overflow-y: auto;
      padding: 0;
      background: var(--main-bg);
    }
    .markdown {
      max-width: 880px; margin: 0 auto;
      padding: 40px 48px 60px;
      line-height: 1.8; color: #333;
    }
    /* 欢迎页 */
    .welcome {
      text-align: center; padding-top: 120px;
    }
    .welcome .logo {
      font-size: 48px; margin-bottom: 16px;
    }
    .welcome h2 {
      font-size: 28px; color: var(--heading);
      margin-bottom: 8px; border: none;
    }
    .welcome p {
      color: #888; font-size: 15px;
      margin: 8px 0;
    }
    .welcome .tags {
      margin-top: 32px; display: flex;
      flex-wrap: wrap; justify-content: center; gap: 8px;
      max-width: 500px; margin-left: auto; margin-right: auto;
    }
    .welcome .tags span {
      background: #eef0f5; color: #555;
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px;
    }

    /* ===== Markdown 内容样式 ===== */
    .markdown h1 {
      font-size: 26px; margin: 0 0 16px;
      color: var(--heading);
      border-bottom: 3px solid var(--accent);
      padding-bottom: 10px;
    }
    .markdown h2 {
      font-size: 20px; margin: 28px 0 12px;
      color: var(--heading);
    }
    .markdown h3 {
      font-size: 16px; margin: 20px 0 8px;
      color: #444;
    }
    .markdown p { margin: 10px 0; }
    .markdown ul, .markdown ol { padding-left: 22px; margin: 8px 0; }
    .markdown li { margin: 4px 0; }
    .markdown strong { color: var(--heading); }

    /* 表格 */
    .markdown table {
      border-collapse: collapse; margin: 16px 0;
      width: 100%; font-size: 14px;
    }
    .markdown th {
      background: #f0f2f5; color: var(--heading);
      font-weight: 600; border: 1px solid #ddd;
      padding: 10px 14px; text-align: left;
    }
    .markdown td {
      border: 1px solid #ddd;
      padding: 8px 14px;
    }
    .markdown tr:nth-child(even) { background: #f8f9fc; }

    /* 行内代码 */
    .markdown code:not(pre code) {
      background: #2d2d2d; color: #ce9178;
      padding: 2px 7px; border-radius: 4px;
      font-size: 13px; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    /* 代码块 - VS Code 暗色主题 */
    .markdown pre {
      background: #1e1e1e; color: #d4d4d4;
      padding: 18px 20px; border-radius: 10px;
      overflow-x: auto; margin: 16px 0;
      font-size: 13.5px; line-height: 1.6;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      border: 1px solid #333;
    }
    .markdown pre code {
      background: none; color: inherit;
      padding: 0; border-radius: 0;
      font-size: inherit;
    }

    /* 引用 */
    .markdown blockquote {
      border-left: 4px solid var(--accent);
      margin: 16px 0; padding: 12px 20px;
      background: #f8f9fc; color: #555;
      border-radius: 0 8px 8px 0;
    }

    /* 水平线 */
    .markdown hr {
      border: none; border-top: 1px solid #e0e0e0;
      margin: 24px 0;
    }

    /* 加载动画 */
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-dim); font-size: 14px;
    }
    .loading::after {
      content: ''; width: 20px; height: 20px;
      border: 2px solid #e0e0e0; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .sidebar { width: 260px; min-width: 260px; }
      .markdown { padding: 24px 20px 40px; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.css">
  <style>
    #graphContainer { position: fixed; top: 0; left: 340px; right: 0; bottom: 0; visibility: hidden; z-index: 10; background: #1a1a2e; }
    #graphContainer.active { visibility: visible; }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>📚 面试<span>知识库</span></h1>
      <p id="totalCount"></p>
      <div class="sub-info" id="catLegend">
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="搜索知识点（中文/英文）..." autofocus>
    </div>
    <div class="category-tabs" id="categoryTabs">
      <button class="cat-btn active" data-cat="all">全部 <span class="count" id="catAllCount"></span></button>
    </div>
    <div class="view-toggle">
      <button id="listViewBtn" class="active" onclick="switchView('list')">📋 列表</button>
      <button id="graphViewBtn" onclick="switchView('graph')">🕸️ 图谱</button>
    </div>
    <div class="sidebar-stats">
      <span id="resultCount">全部</span>
      <span id="resultNumber"></span>
    </div>
    <div class="file-list" id="fileList">
      <div class="loading">加载中</div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main" id="content" style="position:relative;">
    <div class="markdown welcome" id="welcome">
      <div class="logo">📚</div>
      <h2>面试知识库</h2>
      <p id="welcomeCount">加载中...</p>
      <p style="font-size:13px;color:#aaa;">左侧搜索框输入关键词过滤，点击文件名查看详情</p>
      <div class="tags" id="welcomeTags"></div>
    </div>
  </div>

  <div id="graphContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
  <script>
    const files = [];
    
    let graphInitialized = false;
    let network = null;

    let currentCategory = 'all';

    // 分类颜色映射
    const catColors = {
      '基础知识': '#61afef',
      '项目': '#98c379',
      'AI': '#c678dd',
    };

    function updateCategoryCounts() {
      const cats = {};
      for (const f of files) {
        cats[f.category] = (cats[f.category] || 0) + 1;
      }
      // 更新全部计数
      document.getElementById('catAllCount').textContent = files.length;
      // 更新各分类按钮计数
      document.querySelectorAll('.cat-btn[data-cat]').forEach(btn => {
        const c = btn.getAttribute('data-cat');
        const el = document.getElementById('cat' + c + 'Count');
        if (el) el.textContent = cats[c] || 0;
      });
    }

    function initCategoryTabs() {
      const cats = {};
      for (const f of files) {
        cats[f.category] = (cats[f.category] || 0) + 1;
      }
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '<button class="cat-btn active" data-cat="all">全部 <span class="count" id="catAllCount">' + files.length + '</span></button>';
      const ordered = ['基础知识', '项目', 'AI'];
      const icons = { '基础知识': '📖', '项目': '🔧', 'AI': '🤖' };
      for (const cat of ordered) {
        if (cats[cat]) {
          container.innerHTML += '<button class="cat-btn" data-cat="' + cat + '">' + (icons[cat] || '📄') + ' ' + cat + ' <span class="count" id="cat' + cat + 'Count">' + cats[cat] + '</span></button>';
        }
      }
      // 重新绑定事件
      document.querySelectorAll('.cat-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-cat');
          renderFiles(getFilteredFiles());
        });
      });
    }

    function updateWelcome() {
      const counts = {};
      const subCounts = {};
      for (const f of files) {
        counts[f.category] = (counts[f.category] || 0) + 1;
        if (f.subcategory) {
          const key = f.category + '/' + f.subcategory;
          subCounts[key] = (subCounts[key] || 0) + 1;
        }
      }
      document.getElementById('totalCount').textContent = files.length + ' 个知识点 · 客户端搜索';
      document.getElementById('welcomeCount').textContent = files.length + ' 个知识点 · 零服务器成本 · 全文搜索';

      // 图例
      const legend = document.getElementById('catLegend');
      legend.innerHTML = Object.entries(counts).map(([cat, n]) =>
        '<span><span class="cat-dot" style="background:' + (catColors[cat] || '#636d83') + ';"></span>' + cat + ' (' + n + ')</span>'
      ).join('');

      // 欢迎页标签
      const tags = document.getElementById('welcomeTags');
      tags.innerHTML = Object.entries(subCounts).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([k, n]) =>
        '<span>' + k + ' (' + n + ')</span>'
      ).join('');
    }

    function getFilteredFiles() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      let result = files;
      if (currentCategory !== 'all') {
        result = result.filter(f => f.category === currentCategory);
      }
      if (q) {
        result = result.filter(f =>
          (f.name && f.name.toLowerCase().includes(q)) ||
          (f.title && f.title.toLowerCase().includes(q)) ||
          (f.path && f.path.toLowerCase().includes(q))
        );
      }
      return result;
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('listViewBtn').className = view === 'list' ? 'active' : '';
      document.getElementById('graphViewBtn').className = view === 'graph' ? 'active' : '';
      document.getElementById('fileList').style.display = view === 'list' ? '' : 'none';
      document.getElementById('searchInput').disabled = view === 'graph';
      document.getElementById('searchInput').placeholder = view === 'graph' ? '图谱模式' : '搜索知识点...';
      const gc = document.getElementById('graphContainer');
      gc.className = view === 'graph' ? 'active' : '';
      if (view === 'graph') {
        document.body.style.overflow = 'hidden';
        if (!graphInitialized) initGraph();
      } else {
        document.body.style.overflow = '';
      }
    }

    async function initGraph() {
      graphInitialized = true;
      const gc = document.getElementById('graphContainer');
      gc.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8892b0;font-size:16px;flex-direction:column;gap:12px;"><div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#e94560;border-radius:50%;animation:spin 0.6s linear infinite;"></div><span>加载知识图谱...</span></div>';
      try {
        const resp = await fetch('concepts/graph.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const gd = await resp.json();

        // 图谱分组使用实际分类
        const graphColors = {
          '基础知识': '#61afef',
          '项目': '#98c379',
          'AI': '#c678dd',
        };

        const conn = {};
        for (const e of gd.edges) {
          conn[e.source] = (conn[e.source] || 0) + 1;
          conn[e.target] = (conn[e.target] || 0) + 1;
        }
        const maxC = Math.max(1, ...Object.values(conn));

        const nodes = gd.nodes.map(n => {
          const g = n.group || 'other';
          const c = conn[n.id] || 0;
          return {
            id: n.id,
            label: n.title.length > 15 ? n.title.substr(0,15) + '...' : n.title,
            title: '<b>' + n.title + '</b><br>' + n.path + '<br>连接: ' + c,
            color: { background: graphColors[g] || '#636d83', border: '#fff' },
            size: Math.max(12, Math.min(12 + (c / maxC) * 18, 32)),
            font: { color: '#fff', size: 12, strokeWidth: 0 },
            path: n.path,
          };
        });

        const edges = gd.edges.map(e => ({
          from: e.source, to: e.target,
          color: { color: 'rgba(255,255,255,0.15)', hover: '#e94560' },
          width: 0.5
        }));

        setTimeout(function() {
          gc.innerHTML = '';
          const vdata = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
          const opts = {
            nodes: { shape: 'dot' },
            physics: { stabilization: { iterations: 50 }, solver: 'barnesHut',
              barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 120, springConstant: 0.04, damping: 0.5 } },
            interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true },
          };
          network = new vis.Network(gc, vdata, opts);
          network.fit();
          network.on('click', function(params) {
            if (params.nodes.length > 0) {
              const node = nodes.find(n => n.id === params.nodes[0]);
              if (node && node.path) { switchView('list'); setTimeout(function() { loadFile(node.path); }, 100); }
            }
          });
        }, 100);
      } catch(e) {
        gc.innerHTML = '<div class="file-item empty" style="padding:40px;">图谱加载失败: ' + e.message + '</div>';
      }
    }

    let currentPath = '';
    let currentView = 'list'

    // ===== 加载文件列表 =====
    async function loadFileList() {
      const el = document.getElementById('fileList');
      try {
        const resp = await fetch('concepts/index.json');
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const list = await resp.json();
        files.push(...list);
        initCategoryTabs();
        updateWelcome();
        renderFiles(files);
      } catch(e) {
        el.innerHTML = '<div class="file-item empty">加载失败，请刷新重试</div>';
      }
    }

    // ===== 渲染文件列表（支持子类分组） =====
    function renderFiles(list) {
      const el = document.getElementById('fileList');
      if (list.length === 0) {
        el.innerHTML = '<div class="file-item empty">无匹配结果</div>';
        document.getElementById('resultNumber').textContent = '0 / ' + files.length;
        return;
      }

      // 是否按子类分组（当选中某个大类时）
      const groupBySub = currentCategory !== 'all' && currentCategory !== '';
      let html = '';

      if (groupBySub) {
        // 按 subcategory 分组
        const groups = {};
        for (const f of list) {
          const sub = f.subcategory || '其他';
          if (!groups[sub]) groups[sub] = [];
          groups[sub].push(f);
        }
        const sortedSubs = Object.keys(groups).sort();
        for (const sub of sortedSubs) {
          const items = groups[sub];
          html += `<div class="subcat-header" onclick="toggleSubcat(this)">
            <span class="subcat-arrow">▼</span>
            <span class="subcat-name">${sub}</span>
            <span class="subcat-count">${items.length}</span>
          </div>`;
          html += `<div class="subcat-items">`;
          for (const f of items) {
            const active = f.path === currentPath ? ' active' : '';
            html += `<div class="file-item${active}" onclick="loadFile('${f.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
              <div class="title">${f.title || f.name}</div>
              <div class="path">${f.path}</div>
            </div>`;
          }
          html += `</div>`;
        }
      } else {
        // 全部 / 搜索模式 — 平铺列表
        html = list.map(f => {
          const active = f.path === currentPath ? ' active' : '';
          return `<div class="file-item${active}" onclick="loadFile('${f.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
            <div class="title">${f.title || f.name}</div>
            <div class="path">${f.path}</div>
          </div>`;
        }).join('');
      }

      el.innerHTML = html;
      document.getElementById('resultCount').textContent =
        list.length === files.length ? '全部' : '筛选';
      document.getElementById('resultNumber').textContent =
        list.length + ' / ' + files.length;
    }

    // 展开/折叠子类
    function toggleSubcat(header) {
      const items = header.nextElementSibling;
      if (items && items.classList.contains('subcat-items')) {
        const isOpen = items.style.display !== 'none';
        items.style.display = isOpen ? 'none' : '';
        header.querySelector('.subcat-arrow').textContent = isOpen ? '▶' : '▼';
      }
    }

    // ===== 加载文件内容 =====
    async function loadFile(path) {
      currentPath = path;
      // 高亮当前项
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
      // 通过 path 匹配
      document.querySelectorAll('.file-item').forEach(el => {
        const pathEl = el.querySelector('.path');
        if (pathEl && pathEl.textContent === path) {
          el.classList.add('active');
          el.scrollIntoView({ block: 'nearest' });
        }
      });

      const main = document.getElementById('content');
      main.innerHTML = '<div class="loading">加载中</div>';

      try {
        const resp = await fetch('concepts/' + encodeURI(path));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();

        // 配置 marked
        marked.setOptions({
          breaks: true,
          gfm: true,
          highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              try { return hljs.highlight(code, { language: lang }).value; } catch(e) {}
            }
            try { return hljs.highlightAuto(code).value; } catch(e) {}
            return code;
          }
        });

        const html = marked.parse(text);
        main.innerHTML = '<div class="markdown">' + html + '</div>';
        main.scrollTop = 0;
      } catch(e) {
        main.innerHTML = '<div class="markdown"><p style="color:#e94560;padding:40px;">❌ 加载失败: ' + e.message + '</p></div>';
      }
    }

    // ===== 搜索和分类筛选 =====
    document.getElementById('searchInput').addEventListener('input', function() {
      renderFiles(getFilteredFiles());
    });

    document.querySelectorAll('.cat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-cat');
        renderFiles(getFilteredFiles());
      });
    });

    // ===== 键盘快捷键 =====
    document.addEventListener('keydown', function(e) {
      // Ctrl+F / Cmd+F 聚焦搜索框
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      // Escape 清空搜索
      if (e.key === 'Escape') {
        const input = document.getElementById('searchInput');
        if (input === document.activeElement) {
          input.value = '';
          renderFiles(files);
          input.blur();
        }
      }
    });

    loadFileList();
  </script>
</body>
</html>
