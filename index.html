<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试知识库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --sidebar-bg: #1a1a2e;
      --sidebar-hover: #16213e;
      --sidebar-active: #0f3460;
      --accent: #e94560;
      --accent2: #533483;
      --text-light: #e0e0e0;
      --text-dim: #8892b0;
      --main-bg: #f8f9fc;
      --card-bg: #ffffff;
      --border: #e8e8ec;
      --heading: #1a1a2e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      display: flex; height: 100vh; background: var(--main-bg);
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 340px; min-width: 340px;
      background: var(--sidebar-bg);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-header h1 {
      font-size: 18px; font-weight: 700;
      color: #fff; letter-spacing: 0.5px;
    }
    .sidebar-header h1 span { color: var(--accent); }
    .sidebar-header p {
      font-size: 12px; color: var(--text-dim);
      margin-top: 4px;
    }
    .sidebar-header .sub-info {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; display: flex; gap: 8px;
    }
    .sidebar-header .sub-info .cat-dot {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; vertical-align: middle; margin-right: 3px;
    }
    .sidebar-search {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .sidebar-search input {
      width: 100%; padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; font-size: 13px;
      background: rgba(255,255,255,0.06);
      color: #fff; outline: none;
      transition: all 0.2s;
    }
    .sidebar-search input::placeholder { color: var(--text-dim); }
    .sidebar-search input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.1);
    }
    .category-tabs {
      display: flex; padding: 8px 16px; gap: 5px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
    }
    .cat-btn {
      padding: 3px 11px; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; background: transparent;
      color: var(--text-dim); font-size: 11.5px; cursor: pointer;
      transition: all 0.2s; white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--text-light); }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .cat-btn .count {
      display: inline-block; margin-left: 3px;
      font-size: 10px; opacity: 0.7;
    }
    .cat-btn.active .count { opacity: 0.9; }
    /* 子类筛选条 */
    .subcat-bar {
      padding: 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-wrap: wrap; gap: 4px;
      min-height: 0;
      max-height: 80px;
      overflow-y: auto;
    }
    .subcat-bar:empty { display: none; }
    .subcat-bar::-webkit-scrollbar { width: 3px; }
    .subcat-bar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
    .subcat-btn {
      padding: 2px 9px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .subcat-btn:hover {
      border-color: var(--accent);
      color: var(--text-light);
    }
    .subcat-btn.active {
      background: var(--accent2);
      color: #fff;
      border-color: var(--accent2);
    }

    .sidebar-stats {
      display: flex; justify-content: space-between;
      padding: 8px 16px;
      font-size: 12px; color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .view-toggle {
      display: flex; padding: 6px 16px; gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .view-toggle button {
      flex: 1; padding: 5px 0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; background: transparent;
      color: var(--text-dim); font-size: 12px; cursor: pointer;
      transition: all 0.2s;
    }
    .view-toggle button:hover {
      border-color: var(--accent); color: var(--text-light);
    }
    .view-toggle button.active {
      background: var(--accent); color: #fff; border-color: var(--accent);
    }
    .file-list {
      flex: 1; overflow-y: auto;
      padding: 4px 0 12px;
    }
    .file-list::-webkit-scrollbar { width: 4px; }
    .file-list::-webkit-scrollbar-track { background: transparent; }
    .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .file-item {
      padding: 10px 16px; cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .file-item:hover { background: rgba(255,255,255,0.05); }
    .file-item.active {
      background: rgba(233,69,96,0.1);
      border-left-color: var(--accent);
    }
    .file-item .title {
      font-size: 13px; color: var(--text-light);
      line-height: 1.4;
    }
    .file-item.active .title { color: #fff; font-weight: 500; }
    .file-item .path {
      font-size: 11px; color: var(--text-dim);
      margin-top: 2px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .file-item.empty {
      color: var(--text-dim); font-size: 13px;
      padding: 24px 16px; text-align: center;
    }

    /* 子类分组头 */
    .subcat-header {
      padding: 8px 16px; cursor: pointer;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 6px;
      user-select: none;
    }
    .subcat-header:hover { background: rgba(255,255,255,0.07); }
    .subcat-arrow {
      font-size: 10px; color: var(--text-dim);
      width: 14px; text-align: center;
      transition: transform 0.15s;
    }
    .subcat-name {
      font-size: 12px; color: var(--text-light);
      font-weight: 600; flex: 1;
    }
    .subcat-count {
      font-size: 11px; color: var(--text-dim);
      background: rgba(255,255,255,0.08);
      padding: 1px 8px; border-radius: 10px;
    }
    .subcat-items .file-item { padding-left: 28px; }
    .subcat-items .file-item .path { padding-left: 0; }
    /* 子类导航项（左侧直接显示） */
    .subcat-nav-item {
      padding: 10px 16px; cursor: pointer;
      border-left: 2px solid transparent;
      transition: all 0.15s;
    }
    .subcat-nav-item:hover {
      background: rgba(255,255,255,0.05);
      border-left-color: var(--accent2);
    }
    .subcat-nav-item .nav-title {
      font-size: 13px; color: var(--text-light);
    }
    .subcat-nav-item .nav-desc {
      font-size: 11px; color: var(--text-dim);
      margin-top: 1px;
    }
    .cat-header-nav {
      padding: 8px 16px; cursor: default;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 6px;
    }
    .cat-header-nav .cat-name {
      font-size: 13px; color: var(--text-light); font-weight: 600; flex: 1;
    }
    .cat-header-nav .cat-count {
      font-size: 11px; color: var(--text-dim);
      background: rgba(255,255,255,0.08);
      padding: 1px 8px; border-radius: 10px;
    }
    /* 子类文件列表头部的返回按钮 */
    .subcat-back {
      padding: 8px 16px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--text-dim); font-size: 12px;
      transition: all 0.15s;
    }
    .subcat-back:hover { color: var(--text-light); background: rgba(255,255,255,0.03); }

    /* ===== 主内容区 ===== */
    .main {
      flex: 1; overflow-y: auto;
      padding: 0;
      background: var(--main-bg);
    }
    .markdown {
      max-width: 880px; margin: 0 auto;
      padding: 40px 48px 60px;
      line-height: 1.8; color: #333;
    }
    /* 欢迎页 */
    .welcome {
      text-align: center; padding-top: 120px;
    }
    .welcome .logo {
      font-size: 48px; margin-bottom: 16px;
    }
    .welcome h2 {
      font-size: 28px; color: var(--heading);
      margin-bottom: 8px; border: none;
    }
    .welcome p {
      color: #888; font-size: 15px;
      margin: 8px 0;
    }
    .welcome .tags {
      margin-top: 32px; display: flex;
      flex-wrap: wrap; justify-content: center; gap: 8px;
      max-width: 500px; margin-left: auto; margin-right: auto;
    }
    .welcome .tags span {
      background: #eef0f5; color: #555;
      padding: 6px 14px; border-radius: 20px;
      font-size: 13px;
    }

    /* ===== Markdown 内容样式 ===== */
    .markdown h1 {
      font-size: 26px; margin: 0 0 16px;
      color: var(--heading);
      border-bottom: 3px solid var(--accent);
      padding-bottom: 10px;
    }
    .markdown h2 {
      font-size: 20px; margin: 28px 0 12px;
      color: var(--heading);
    }
    .markdown h3 {
      font-size: 16px; margin: 20px 0 8px;
      color: #444;
    }
    .markdown p { margin: 10px 0; }
    .markdown ul, .markdown ol { padding-left: 22px; margin: 8px 0; }
    .markdown li { margin: 4px 0; }
    .markdown strong { color: var(--heading); }

    /* 表格 */
    .markdown table {
      border-collapse: collapse; margin: 16px 0;
      width: 100%; font-size: 14px;
    }
    .markdown th {
      background: #f0f2f5; color: var(--heading);
      font-weight: 600; border: 1px solid #ddd;
      padding: 10px 14px; text-align: left;
    }
    .markdown td {
      border: 1px solid #ddd;
      padding: 8px 14px;
    }
    .markdown tr:nth-child(even) { background: #f8f9fc; }

    /* 行内代码 */
    .markdown code:not(pre code) {
      background: #f0f0f0; color: #c7254e;
      padding: 2px 7px; border-radius: 4px;
      font-size: 13px; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
    }
    /* 代码块 - VS Code 暗色主题 */
    .markdown pre {
      background: #1e1e1e; color: #d4d4d4;
      padding: 18px 20px; border-radius: 10px;
      overflow-x: auto; margin: 16px 0;
      font-size: 13.5px; line-height: 1.6;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      border: 1px solid #333;
    }
    .markdown pre code {
      background: none; color: inherit;
      padding: 0; border-radius: 0;
      font-size: inherit;
    }

    /* 引用 */
    .markdown blockquote {
      border-left: 4px solid var(--accent);
      margin: 16px 0; padding: 12px 20px;
      background: #f8f9fc; color: #555;
      border-radius: 0 8px 8px 0;
    }

    /* 水平线 */
    .markdown hr {
      border: none; border-top: 1px solid #e0e0e0;
      margin: 24px 0;
    }

    /* 加载动画 */
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 200px; color: var(--text-dim); font-size: 14px;
    }
    .loading::after {
      content: ''; width: 20px; height: 20px;
      border: 2px solid #e0e0e0; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.6s linear infinite;
      margin-left: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .sidebar { width: 260px; min-width: 260px; }
      .markdown { padding: 24px 20px 40px; }
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.css">
  <style>
    /* VS Code Dark+ 语法高亮（覆盖 atom-one-dark 默认值） */
    pre code.hljs { color: #d4d4d4; }
    .hljs-keyword, .hljs-literal, .hljs-type { color: #569cd6; }
    .hljs-string, .hljs-meta .hljs-string { color: #ce9178; }
    .hljs-comment { color: #6a9955; font-style: italic; }
    .hljs-number { color: #b5cea8; }
    .hljs-built_in { color: #4ec9b0; }
    .hljs-title, .hljs-title.function_ { color: #dcdcaa; }
    .hljs-attr, .hljs-attribute, .hljs-variable { color: #9cdcfe; }
    .hljs-params { color: #9cdcfe; }
    .hljs-meta { color: #d7ba7d; }
    .hljs-selector-tag, .hljs-selector-id, .hljs-selector-class { color: #d7ba7d; }
    .hljs-regexp { color: #d16969; }
    .hljs-symbol, .hljs-section { color: #dcdcaa; }
    .hljs-tag, .hljs-name { color: #569cd6; }
    .hljs-deletion { color: #d16969; background: none; }
    .hljs-addition { color: #6a9955; background: none; }
    .hljs-subst { color: #d4d4d4; }
    #graphContainer { position: fixed; top: 0; left: 340px; right: 0; bottom: 0; visibility: hidden; z-index: 10; background: #1a1a2e; }
    #graphContainer.active { visibility: visible; }

    /* ===== 流程图 / 架构图 增强样式 ===== */
    .markdown pre.diagram {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px 16px;
      overflow-x: auto;
      margin: 20px 0;
      position: relative;
    }
    .markdown pre.diagram code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.3;
      letter-spacing: 0;
      color: #e6edf3;
      white-space: pre;
      display: block;
    }
    .markdown pre.diagram .diagram-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #21262d;
      color: #8b949e;
      font-size: 10px;
      padding: 3px 12px 3px 10px;
      border-radius: 0 10px 0 10px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.3px;
      user-select: none;
      pointer-events: none;
      border-left: 1px solid #30363d;
      border-bottom: 1px solid #30363d;
    }
    .markdown pre.diagram .diagram-zoom {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: rgba(33,38,45,0.8);
      color: #8b949e;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 2;
    }
    .markdown pre.diagram:hover .diagram-zoom {
      opacity: 1;
    }
    .markdown pre.diagram .diagram-zoom:hover {
      background: rgba(48,54,61,0.9);
      color: #e6edf3;
    }

    /* 大图全屏遮罩 */
    .diagram-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: zoom-out;
    }
    .diagram-overlay pre {
      background: #0d1117 !important;
      border: 1px solid #30363d !important;
      border-radius: 12px !important;
      padding: 30px !important;
      max-width: 100%;
      max-height: 90vh;
      overflow: auto;
      cursor: default;
    }
    .diagram-overlay pre code {
      font-size: 14px !important;
      line-height: 1.4 !important;
    }
    .diagram-overlay .diagram-badge,
    .diagram-overlay .diagram-zoom {
      display: none !important;
    }
    .diagram-overlay .diagram-close-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: rgba(0,0,0,0.5);
      padding: 6px 18px;
      border-radius: 20px;
      pointer-events: none;
    }

    /* 小屏适配 */
    @media (max-width: 768px) {
      .markdown pre.diagram { padding: 14px 10px; }
      .markdown pre.diagram code { font-size: 11px; }
      .diagram-overlay { padding: 16px; }
      .diagram-overlay pre { padding: 16px !important; }
      .diagram-overlay pre code { font-size: 12px !important; }
    }

    /* ===== Mermaid 流程图支持 ===== */
    .mermaid-container {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      overflow-x: auto;
      text-align: center;
    }
    .mermaid-container svg {
      max-width: 100%;
      height: auto;
    }
    .markdown pre.mermaid-pre {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>📚 面试<span>知识库</span></h1>
      <p id="totalCount"></p>
      <div class="sub-info" id="catLegend">
      </div>
    </div>
    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="搜索知识点（中文/英文）..." autofocus>
    </div>
    <div class="category-tabs" id="categoryTabs">
      <button class="cat-btn active" data-cat="all">全部 <span class="count" id="catAllCount"></span></button>
    </div>
    <div class="view-toggle">
      <button id="listViewBtn" class="active" onclick="switchView('list')">📋 列表</button>
      <button id="graphViewBtn" onclick="switchView('graph')">🕸️ 图谱</button>
    </div>
    <div class="subcat-bar" id="subcatBar"></div>
    <div class="sidebar-stats">
      <span id="resultCount">全部</span>
      <span id="resultNumber"></span>
    </div>
    <div class="file-list" id="fileList">
      <div class="loading">加载中</div>
    </div>
  </div>

  <!-- 主内容 -->
  <div class="main" id="content" style="position:relative;">
    <div class="markdown welcome" id="welcome">
      <div class="logo">📚</div>
      <h2>面试知识库</h2>
      <p id="welcomeCount">加载中...</p>
      <p style="font-size:13px;color:#aaa;">左侧搜索框输入关键词过滤，点击文件名查看详情</p>
      <div class="tags" id="welcomeTags"></div>
    </div>
  </div>

  <div id="graphContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.6/dist/vis-network.min.js"></script>
  <script>
    const files = [];
    
    let graphInitialized = false;
    let network = null;

    let currentCategory = 'all';
    let currentSubcategory = '';

    // 分类颜色映射
    const catColors = {
      '基础知识': '#61afef',
      '项目': '#98c379',
      'AI': '#c678dd',
    };

    function updateCategoryCounts() {
      const cats = {};
      for (const f of files) {
        cats[f.category] = (cats[f.category] || 0) + 1;
      }
      // 更新全部计数
      document.getElementById('catAllCount').textContent = files.length;
      // 更新各分类按钮计数
      document.querySelectorAll('.cat-btn[data-cat]').forEach(btn => {
        const c = btn.getAttribute('data-cat');
        const el = document.getElementById('cat' + c + 'Count');
        if (el) el.textContent = cats[c] || 0;
      });
    }

    function initCategoryTabs() {
      const cats = {};
      for (const f of files) {
        cats[f.category] = (cats[f.category] || 0) + 1;
      }
      const container = document.getElementById('categoryTabs');
      container.innerHTML = '<button class="cat-btn active" data-cat="all">全部 <span class="count" id="catAllCount">' + files.length + '</span></button>';
      const ordered = ['基础知识', '项目', 'AI'];
      const icons = { '基础知识': '📖', '项目': '🔧', 'AI': '🤖' };
      for (const cat of ordered) {
        if (cats[cat]) {
          container.innerHTML += '<button class="cat-btn" data-cat="' + cat + '">' + (icons[cat] || '📄') + ' ' + cat + ' <span class="count" id="cat' + cat + 'Count">' + cats[cat] + '</span></button>';
        }
      }
      // 重新绑定事件
      document.querySelectorAll('.cat-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-cat');
          currentSubcategory = '';
          renderFiles(getFilteredFiles());
        });
      });
    }

    function updateWelcome() {
      const counts = {};
      const subCounts = {};
      for (const f of files) {
        counts[f.category] = (counts[f.category] || 0) + 1;
        if (f.subcategory) {
          const key = f.category + '/' + f.subcategory;
          subCounts[key] = (subCounts[key] || 0) + 1;
        }
      }
      document.getElementById('totalCount').textContent = files.length + ' 个知识点 · 客户端搜索';
      document.getElementById('welcomeCount').textContent = files.length + ' 个知识点 · 零服务器成本 · 全文搜索';

      // 图例
      const legend = document.getElementById('catLegend');
      legend.innerHTML = Object.entries(counts).map(([cat, n]) =>
        '<span><span class="cat-dot" style="background:' + (catColors[cat] || '#636d83') + ';"></span>' + cat + ' (' + n + ')</span>'
      ).join('');

      // 欢迎页标签
      const tags = document.getElementById('welcomeTags');
      tags.innerHTML = Object.entries(subCounts).sort((a, b) => b[1] - a[1]).slice(0, 15).map(([k, n]) =>
        '<span>' + k + ' (' + n + ')</span>'
      ).join('');
    }

    function getFilteredFiles() {
      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      let result = files;
      if (currentCategory !== 'all') {
        result = result.filter(f => f.category === currentCategory);
      }
      if (currentSubcategory) {
        result = result.filter(f => f.subcategory === currentSubcategory);
      }
      if (q) {
        result = result.filter(f =>
          (f.name && f.name.toLowerCase().includes(q)) ||
          (f.title && f.title.toLowerCase().includes(q)) ||
          (f.path && f.path.toLowerCase().includes(q))
        );
      }
      return result;
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('listViewBtn').className = view === 'list' ? 'active' : '';
      document.getElementById('graphViewBtn').className = view === 'graph' ? 'active' : '';
      document.getElementById('fileList').style.display = view === 'list' ? '' : 'none';
      document.getElementById('searchInput').disabled = view === 'graph';
      document.getElementById('searchInput').placeholder = view === 'graph' ? '图谱模式' : '搜索知识点...';
      const gc = document.getElementById('graphContainer');
      gc.className = view === 'graph' ? 'active' : '';
      if (view === 'graph') {
        document.body.style.overflow = 'hidden';
        if (!graphInitialized) initGraph();
      } else {
        document.body.style.overflow = '';
      }
    }

    async function initGraph() {
      graphInitialized = true;
      const gc = document.getElementById('graphContainer');
      gc.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8892b0;font-size:16px;flex-direction:column;gap:12px;"><div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.1);border-top-color:#e94560;border-radius:50%;animation:spin 0.6s linear infinite;"></div><span>加载知识图谱...</span></div>';
      try {
        const resp = await fetch('concepts/graph.json?_=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const gd = await resp.json();

        // 图谱分组使用实际分类
        const graphColors = {
          '基础知识': '#61afef',
          '项目': '#98c379',
          'AI': '#c678dd',
        };

        const conn = {};
        for (const e of gd.edges) {
          conn[e.source] = (conn[e.source] || 0) + 1;
          conn[e.target] = (conn[e.target] || 0) + 1;
        }
        const maxC = Math.max(1, ...Object.values(conn));

        const nodes = gd.nodes.map(n => {
          const g = n.group || 'other';
          const c = conn[n.id] || 0;
          return {
            id: n.id,
            label: n.title.length > 15 ? n.title.substr(0,15) + '...' : n.title,
            title: '<b>' + n.title + '</b><br>' + n.path + '<br>连接: ' + c,
            color: { background: graphColors[g] || '#636d83', border: '#fff' },
            size: Math.max(12, Math.min(12 + (c / maxC) * 18, 32)),
            font: { color: '#fff', size: 12, strokeWidth: 0 },
            path: n.path,
          };
        });

        const edges = gd.edges.map(e => ({
          from: e.source, to: e.target,
          color: { color: 'rgba(255,255,255,0.15)', hover: '#e94560' },
          width: 0.5
        }));

        setTimeout(function() {
          gc.innerHTML = '';
          const vdata = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
          const opts = {
            nodes: { shape: 'dot' },
            physics: { stabilization: { iterations: 50 }, solver: 'barnesHut',
              barnesHut: { gravitationalConstant: -3000, centralGravity: 0.3, springLength: 120, springConstant: 0.04, damping: 0.5 } },
            interaction: { hover: true, tooltipDelay: 200, navigationButtons: true, keyboard: true },
          };
          network = new vis.Network(gc, vdata, opts);
          network.fit();
          network.on('click', function(params) {
            if (params.nodes.length > 0) {
              const node = nodes.find(n => n.id === params.nodes[0]);
              if (node && node.path) { switchView('list'); setTimeout(function() { loadFile(node.path); }, 100); }
            }
          });
        }, 100);
      } catch(e) {
        gc.innerHTML = '<div class="file-item empty" style="padding:40px;">图谱加载失败: ' + e.message + '</div>';
      }
    }

    let currentPath = '';
    let currentView = 'list'

    // ===== 加载文件列表 =====
    async function loadFileList() {
      const el = document.getElementById('fileList');
      try {
        const resp = await fetch('concepts/index.json?_=' + Date.now());
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const list = await resp.json();
        files.push(...list);
        initCategoryTabs();
        updateWelcome();
        renderFiles(files);
      } catch(e) {
        el.innerHTML = '<div class="file-item empty">加载失败，请刷新重试</div>';
      }
    }

    // ===== 渲染文件列表（支持子类分组） =====
    function renderFiles(list) {
      const el = document.getElementById('fileList');

      // 如果已选中某个子类，显示该子类的文件列表
      if (currentSubcategory) {
        const filtered = currentCategory !== 'all'
          ? list.filter(f => f.subcategory === currentSubcategory)
          : list.filter(f => f.subcategory === currentSubcategory);

        if (filtered.length === 0) {
          el.innerHTML = '<div class="file-item empty">无匹配结果</div>';
          document.getElementById('resultNumber').textContent = '0 / ' + files.length;
          updateSubcatBar([]);
          return;
        }

        let html = `<div class="subcat-back" onclick="clickSubcatBack()">← 返回子类列表</div>
        <div class="subcat-header" style="cursor:default;background:rgba(233,69,96,0.08);border-left:3px solid var(--accent);margin:0;">
          <span class="subcat-name" style="color:var(--accent);font-weight:600;">📁 ${currentSubcategory}</span>
          <span class="subcat-count">${filtered.length}</span>
        </div>`;
        html += `<div class="subcat-items">`;
        for (const f of filtered) {
          const active = f.path === currentPath ? ' active' : '';
          html += `<div class="file-item${active}" onclick="loadFile('${f.path.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
            <div class="title">${f.title || f.name}</div>
            <div class="path">${f.path}</div>
          </div>`;
        }
        html += `</div>`;
        el.innerHTML = html;
        document.getElementById('resultCount').textContent = '子类';
        document.getElementById('resultNumber').textContent = filtered.length + ' / ' + files.length;
        updateSubcatBar(filtered);
        return;
      }

      // 未选子类：显示子类导航列表（按大类分组）
      // 收集所有子类
      const subcats = {};
      for (const f of list) {
        const sub = f.subcategory || '其他';
        if (!subcats[sub]) subcats[sub] = { count: 0, category: f.category };
        subcats[sub].count++;
      }
      const sortedSubs = Object.keys(subcats).sort();

      if (sortedSubs.length === 0) {
        el.innerHTML = '<div class="file-item empty">无匹配结果</div>';
        document.getElementById('resultNumber').textContent = '0 / ' + files.length;
        updateSubcatBar([]);
        return;
      }

      let html = '';
      // 如果是在"全部"视图，按大类分组显示子类
      if (currentCategory === 'all') {
        const catOrder = ['AI', '基础知识', '项目'];
        const catIcons = { 'AI': '🤖', '基础知识': '📖', '项目': '🔧' };
        for (const cat of catOrder) {
          const subs = Object.entries(subcats)
            .filter(([_, v]) => v.category === cat)
            .sort((a, b) => a[0].localeCompare(b[0]));
          if (subs.length === 0) continue;
          html += `<div class="cat-header-nav">
            <span class="cat-name">${catIcons[cat] || '📄'} ${cat}</span>
            <span class="cat-count">${subs.reduce((s, [_, v]) => s + v.count, 0)}</span>
          </div>`;
          for (const [sub, info] of subs) {
            html += `<div class="subcat-nav-item" onclick="clickSubcat('${sub.replace(/'/g,"\\'")}')">
              <div class="nav-title">📂 ${sub}</div>
              <div class="nav-desc">${info.count} 个知识点</div>
            </div>`;
          }
        }
      } else {
        // 特定大类下，直接显示子类列表
        for (const sub of sortedSubs) {
          const info = subcats[sub];
          html += `<div class="subcat-nav-item" onclick="clickSubcat('${sub.replace(/'/g,"\\'")}')">
            <div class="nav-title">📂 ${sub}</div>
            <div class="nav-desc">${info.count} 个知识点</div>
          </div>`;
        }
      }

      el.innerHTML = html;
      document.getElementById('resultCount').textContent =
        currentCategory === 'all' ? '全部' : '大类';
      document.getElementById('resultNumber').textContent =
        list.length + ' / ' + files.length;

      updateSubcatBar(list);
    }

    // 点击子类：显示该子类的文件列表
    function clickSubcat(sub) {
      currentSubcategory = sub;
      renderFiles(getFilteredFiles());
    }

    // 子类筛选条（小标签，快速切换）
    function updateSubcatBar(list) {
      const bar = document.getElementById('subcatBar');
      const subcats = {};
      for (const f of list) {
        const sub = f.subcategory || '其他';
        if (subcats[sub]) subcats[sub]++;
        else subcats[sub] = 1;
      }
      const keys = Object.keys(subcats).sort();
      if (keys.length <= 1) { bar.innerHTML = ''; return; }

      let html = `<button class="subcat-btn${!currentSubcategory ? ' active' : ''}" onclick="filterSubcat('')">全部</button>`;
      for (const sub of keys) {
        const active = currentSubcategory === sub ? ' active' : '';
        html += `<button class="subcat-btn${active}" onclick="filterSubcat('${sub.replace(/'/g,"\\'")}')">${sub}</button>`;
      }
      bar.innerHTML = html;
    }

    function filterSubcat(sub) {
      currentSubcategory = sub;
      renderFiles(getFilteredFiles());
    }

    // 返回子类列表
    function clickSubcatBack() {
      currentSubcategory = '';
      if (currentCategory === 'all') {
        // 回到欢迎页
        document.getElementById('content').innerHTML = document.getElementById('welcome').outerHTML;
      }
      renderFiles(getFilteredFiles());
    }

    // ===== 加载文件内容 =====
    async function loadFile(path) {
      currentPath = path;
      // 高亮当前项
      document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
      // 通过 path 匹配
      document.querySelectorAll('.file-item').forEach(el => {
        const pathEl = el.querySelector('.path');
        if (pathEl && pathEl.textContent === path) {
          el.classList.add('active');
          el.scrollIntoView({ block: 'nearest' });
        }
      });

      const main = document.getElementById('content');
      main.innerHTML = '<div class="loading">加载中</div>';

      try {
        const resp = await fetch('concepts/' + encodeURI(path));
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const text = await resp.text();

        marked.setOptions({ breaks: true, gfm: true });

        const html = marked.parse(text);
        main.innerHTML = '<div class="markdown">' + html + '</div>';
        // 高亮所有代码块（highlight 回调在新版 marked 中已移除）
        main.querySelectorAll('pre code').forEach(function(block) {
          hljs.highlightElement(block);
        });
        main.scrollTop = 0;
      } catch(e) {
        main.innerHTML = '<div class="markdown"><p style="color:#e94560;padding:40px;">❌ 加载失败: ' + e.message + '</p></div>';
      }
    }

    // ===== 搜索和分类筛选 =====
    document.getElementById('searchInput').addEventListener('input', function() {
      renderFiles(getFilteredFiles());
    });

    document.querySelectorAll('.cat-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-cat');
        currentSubcategory = '';
        renderFiles(getFilteredFiles());
      });
    });

    // ===== 键盘快捷键 =====
    document.addEventListener('keydown', function(e) {
      // Ctrl+F / Cmd+F 聚焦搜索框
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      // Escape 清空搜索
      if (e.key === 'Escape') {
        const input = document.getElementById('searchInput');
        if (input === document.activeElement) {
          input.value = '';
          renderFiles(files);
          input.blur();
        }
      }
    });

    loadFileList();

    // ===== 流程图增强：检测 ASCII 图表并优化展示 =====
    function enhanceDiagrams() {
      document.querySelectorAll('.markdown pre code').forEach(function(codeBlock) {
        const text = codeBlock.textContent || '';
        // 检测是否有盒式绘图字符（ASCII 架构图/流程图）
        if (/[┌└┐┘├┤┬┴┼─│╔╗╚╝║╠╣╦╩╬═║╒╓╕╖╘╙╛╜╞╟╡╢╤╥╧╨╪╫]/.test(text)) {
          let pre = codeBlock.parentElement;
          // 避免重复处理
          if (pre.classList.contains('diagram')) return;

          // 自动判断图表类型：如果包含多层表格结构算架构图，否则算流程图
          const hasTitle = /┌.*┐\s*\n\s*│/.test(text);
          const badgeText = hasTitle ? '📐 架构图' : '📊 流程图';

          pre.classList.add('diagram');

          // 添加徽章
          const badge = document.createElement('span');
          badge.className = 'diagram-badge';
          badge.textContent = badgeText;
          pre.appendChild(badge);

          // 添加缩放按钮
          const zoomBtn = document.createElement('button');
          zoomBtn.className = 'diagram-zoom';
          zoomBtn.textContent = '🔍 放大查看';
          zoomBtn.title = '点击放大查看完整图表';
          zoomBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            showDiagramOverlay(pre);
          });
          pre.appendChild(zoomBtn);

          // 双击放大
          pre.addEventListener('dblclick', function(e) {
            showDiagramOverlay(pre);
          });
        }
      });
    }

    // 图表全屏遮罩
    function showDiagramOverlay(preElement) {
      var overlay = document.createElement('div');
      overlay.className = 'diagram-overlay';

      var clone = preElement.cloneNode(true);
      // 移除旧按钮
      var oldBadge = clone.querySelector('.diagram-badge');
      if (oldBadge) oldBadge.remove();
      var oldZoom = clone.querySelector('.diagram-zoom');
      if (oldZoom) oldZoom.remove();

      overlay.appendChild(clone);

      var hint = document.createElement('div');
      hint.className = 'diagram-close-hint';
      hint.textContent = '点击任意位置关闭 · 滚轮缩放';
      overlay.appendChild(hint);

      overlay.addEventListener('click', function() {
        overlay.remove();
        document.body.style.overflow = '';
      });

      // ESC 关闭
      function escHandler(e) {
        if (e.key === 'Escape' || e.key === 'Esc') {
          overlay.remove();
          document.body.style.overflow = '';
          document.removeEventListener('keydown', escHandler);
        }
      }
      document.addEventListener('keydown', escHandler);

      document.body.style.overflow = 'hidden';
      document.body.appendChild(overlay);
    }

    // ===== Mermaid 渲染支持 =====
    let mermaidLoaded = false;
    async function renderMermaidDiagrams() {
      const mermaidBlocks = document.querySelectorAll('.markdown pre code.language-mermaid');
      if (mermaidBlocks.length === 0) return;

      // 动态加载 mermaid
      if (!mermaidLoaded) {
        try {
          await new Promise(function(resolve, reject) {
            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
            script.onload = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
          });
          mermaidLoaded = true;
        } catch(e) {
          console.warn('Mermaid 加载失败:', e);
          return;
        }
      }

      mermaidBlocks.forEach(function(block) {
        const pre = block.parentElement;
        if (pre.classList.contains('mermaid-processed')) return;
        pre.classList.add('mermaid-processed');

        const code = block.textContent.trim();
        const container = document.createElement('div');
        container.className = 'mermaid-container';
        container.textContent = code;

        // 替换 pre 为 mermaid 容器
        pre.parentNode.replaceChild(container, pre);

        // 渲染
        try {
          window.mermaid.run({ nodes: [container] });
        } catch(e) {
          console.warn('Mermaid 渲染失败:', e);
          container.innerHTML = '<pre style="background:#1e1e1e;color:#d4d4d4;padding:16px;border-radius:8px;text-align:left;">' + escapeHtml(code) + '</pre>';
        }
      });
    }

    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 重写 loadFile 以在内容加载后执行图表增强
    const _origLoadFile = loadFile;
    loadFile = async function(path) {
      await _origLoadFile(path);
      // 内容渲染后增强图表
      setTimeout(function() {
        enhanceDiagrams();
        renderMermaidDiagrams();
      }, 50);
    };
  </script>
</body>
